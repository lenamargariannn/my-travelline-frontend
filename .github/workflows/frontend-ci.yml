name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  id-token: write
  contents: read

jobs:
  ci-public:
    name: Lint, Test & Build — Public
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        working-directory: apps/mytravelline
        run: npm run lint

      - name: Type check
        working-directory: apps/mytravelline
        run: npx tsc --noEmit

      - name: Test
        working-directory: apps/mytravelline
        run: npm test

      - name: Build
        working-directory: apps/mytravelline
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-public
          path: apps/mytravelline/dist/
          retention-days: 1

  ci-admin:
    name: Lint, Test & Build — Admin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        working-directory: apps/admin
        run: npm run lint

      - name: Type check
        working-directory: apps/admin
        run: npx tsc --noEmit

      - name: Test
        working-directory: apps/admin
        run: npm test

      - name: Build
        working-directory: apps/admin
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-admin
          path: apps/admin/dist/
          retention-days: 1

  deploy-public:
    name: Deploy Public → S3 / CloudFront
    runs-on: ubuntu-latest
    needs: ci-public
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-public
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::947927347939:role/github-actions-mytravelline-frontend-prod
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync static assets to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME }} \
            --delete \
            --exclude "index.html" \
            --cache-control "max-age=31536000,immutable"

      - name: Upload index.html to S3
        run: |
          aws s3 cp dist/index.html s3://${{ vars.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      # Required for SPA routing: serve index.html for any path CloudFront can't find,
      # so React Router can handle /login, /tours, etc. on direct load or refresh.
      - name: Ensure CloudFront SPA error pages
        run: |
          DIST_ID="${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          RESULT=$(aws cloudfront get-distribution-config --id "$DIST_ID")
          ETAG=$(echo "$RESULT" | jq -r '.ETag')
          CURRENT=$(echo "$RESULT" | jq -r '
            [.DistributionConfig.CustomErrorResponses.Items[]?
              | select(.ErrorCode == 403 or .ErrorCode == 404)
              | select(.ResponsePagePath == "/index.html" and .ResponseCode == "200")]
            | length')
          if [ "$CURRENT" -lt 2 ]; then
            echo "Configuring SPA error pages..."
            UPDATED=$(echo "$RESULT" | jq '.DistributionConfig |
              .CustomErrorResponses = {
                "Quantity": 2,
                "Items": [
                  {"ErrorCode": 403, "ResponsePagePath": "/index.html", "ResponseCode": "200", "ErrorCachingMinTTL": 0},
                  {"ErrorCode": 404, "ResponsePagePath": "/index.html", "ResponseCode": "200", "ErrorCachingMinTTL": 0}
                ]
              }')
            aws cloudfront update-distribution \
              --id "$DIST_ID" \
              --distribution-config "$UPDATED" \
              --if-match "$ETAG"
          else
            echo "SPA error pages already configured, skipping."
          fi

  deploy-admin:
    name: Deploy Admin → S3 / CloudFront
    runs-on: ubuntu-latest
    needs: ci-admin
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-admin
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::947927347939:role/github-actions-mytravelline-frontend-prod
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync static assets to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_ADMIN_BUCKET_NAME }} \
            --delete \
            --exclude "index.html" \
            --cache-control "max-age=31536000,immutable"

      - name: Upload index.html to S3
        run: |
          aws s3 cp dist/index.html s3://${{ vars.S3_ADMIN_BUCKET_NAME }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_ADMIN_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Ensure CloudFront SPA error pages
        run: |
          DIST_ID="${{ vars.CLOUDFRONT_ADMIN_DISTRIBUTION_ID }}"
          RESULT=$(aws cloudfront get-distribution-config --id "$DIST_ID")
          ETAG=$(echo "$RESULT" | jq -r '.ETag')
          CURRENT=$(echo "$RESULT" | jq -r '
            [.DistributionConfig.CustomErrorResponses.Items[]?
              | select(.ErrorCode == 403 or .ErrorCode == 404)
              | select(.ResponsePagePath == "/index.html" and .ResponseCode == "200")]
            | length')
          if [ "$CURRENT" -lt 2 ]; then
            echo "Configuring SPA error pages..."
            UPDATED=$(echo "$RESULT" | jq '.DistributionConfig |
              .CustomErrorResponses = {
                "Quantity": 2,
                "Items": [
                  {"ErrorCode": 403, "ResponsePagePath": "/index.html", "ResponseCode": "200", "ErrorCachingMinTTL": 0},
                  {"ErrorCode": 404, "ResponsePagePath": "/index.html", "ResponseCode": "200", "ErrorCachingMinTTL": 0}
                ]
              }')
            aws cloudfront update-distribution \
              --id "$DIST_ID" \
              --distribution-config "$UPDATED" \
              --if-match "$ETAG"
          else
            echo "SPA error pages already configured, skipping."
          fi
